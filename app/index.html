<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline vessel inspection forms - F.17.1 and F.17.2">
  <meta name="theme-color" content="#1B3A6B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vessel Inspection">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vessel Inspection</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Offline support. Registered by hand because the web build uses
    `--pwa-strategy=none`: Flutter's own generated service worker unregisters
    itself and caches nothing, so it cannot keep the app working at sea.
    See web/sw.js.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      // A cache-first worker serves the stored copy instantly, so a new build
      // would otherwise only appear on the visit *after* the one that
      // downloaded it. Reloading once the new worker takes over means users
      // see an update the first time they open the app online, without being
      // told to refresh.
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Catches an update that landed while the app was left open.
          reg.update().catch(function () {});
        }).catch(function (e) {
          console.warn('Offline support unavailable:', e);
        });
      });
    }
  </script>
</body>
</html>
